<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cancha 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0B1219; --bg2:#0F1821; --surface:#131E29; --surface2:#1B2835; --surface3:#233344; --line:#26384B;
  --text:#EEF3F7; --muted:#8FA2B5; --faint:#5F7488;
  --accent:#FF7A1A; --accent-ink:#1A0C00; --accent2:#2FB4FF; --gold:#FFC940;
  --yc:#FFD23F; --rc:#FF4D5E; --good:#35D07F; --ok:#9BD442; --mid:#F2B33D; --bad:#F2683D;
  --pitch1:#1E6B3A; --pitch2:#1A6034; --pitchLine:rgba(255,255,255,.55);
  --disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);letter-spacing:.01em}
.up{text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
#app{min-height:100%;display:flex;flex-direction:column}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:rgba(11,18,25,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;margin:0;font:700 24px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1}
.topbar .brand b{font:800 26px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.topbar .brand b span{color:var(--accent)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:24px;height:24px}
.content{flex:1;padding:16px 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.content.notab{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(15,24,33,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font:700 19px/1 var(--disp);text-transform:uppercase;letter-spacing:.05em;background:var(--surface3);color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--accent2);color:#021623}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid rgba(255,77,94,.5);color:var(--rc)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:16px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bottomcta{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(11,18,25,0))}

/* tarjetas y listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px -4px}
.sec-t h2{margin:0;font:700 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;text-align:left;width:100%}
.row:active{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--faint);flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font:700 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;background:var(--surface3);color:var(--muted);white-space:nowrap}
.chip.acc{background:rgba(255,122,26,.16);color:var(--accent)}
.chip.blue{background:rgba(47,180,255,.14);color:var(--accent2)}
.chip.gold{background:rgba(255,201,64,.16);color:var(--gold)}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(47,180,255,.1);border:1px solid rgba(47,180,255,.3);font-size:14px}
.banner .grow{flex:1}

/* escudos y fotos */
.crest{flex:none;display:block}
.av{flex:none;border-radius:50%;overflow:hidden;background:var(--surface3);display:grid;place-items:center;font:700 16px/1 var(--disp);color:var(--muted);position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sq{border-radius:12px}

/* liga */
.lg-card{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.lg-card .hd{display:flex;align-items:center;gap:10px}
.lg-card h3{margin:0;flex:1;font:700 24px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.crest-strip{display:flex;gap:4px;flex-wrap:wrap}
.prog{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;min-height:38px;padding:0 8px;border-radius:9px;font:700 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface3);color:var(--text)}
.stickyseg{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:15;margin:-16px -16px 0;padding:10px 16px;background:var(--bg)}

.next{padding:16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,#1B2A38,#121C26 70%);border-color:#2E4459}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs .side b{font:700 18px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.vs .mid{font:800 30px/1 var(--disp);color:var(--muted)}
.fx{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:8px;padding:10px 12px;min-height:54px;width:100%}
.fx:active{background:var(--surface2)}
.fx .h,.fx .a{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.fx .h{justify-content:flex-end;text-align:right}
.fx .h span,.fx .a span{font-size:14px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fx .sc{text-align:center;font:700 20px/1 var(--disp);font-variant-numeric:tabular-nums}
.fx .sc.pend{font-size:14px;color:var(--faint);font-family:var(--body);font-weight:600}
.fx.win-h .h,.fx.win-a .a{color:var(--text)}
.fx.win-h .a,.fx.win-a .h{color:var(--muted)}
.rd-t{padding:10px 14px 6px;font:700 14px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}

table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:10px 4px;text-align:center}
.tbl td{padding:9px 4px;text-align:center;border-top:1px solid var(--line)}
.tbl td.tm{text-align:left}
.tbl td.tm div{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tbl td.tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.tbl td.pts{font-weight:800;font-size:16px}
.tbl .pos{width:28px;font-weight:700;color:var(--muted);position:relative}
.tbl tr.q .pos{color:var(--accent2)}
.tbl tr.q .pos::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent2)}
.tbl tr.champ .pos{color:var(--gold)}
.tbl tr.champ .pos::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.tblwrap{overflow-x:auto}
.legend{display:flex;gap:14px;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.leader{display:flex;align-items:center;gap:12px;padding:10px 14px}
.leader .rk{width:20px;font:700 17px/1 var(--disp);color:var(--faint);text-align:center}
.leader .v{font:800 24px/1 var(--disp);min-width:36px;text-align:right}
.leader.first .rk{color:var(--gold)}

/* bracket */
.br{display:flex;flex-direction:column;gap:12px}
.tie{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tie .ln{display:grid;grid-template-columns:24px 1fr repeat(3,34px);align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tie .ln .n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tie .ln .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tie .ln .s{text-align:center;color:var(--muted)}
.tie .ln .ag{text-align:center;font:800 19px/1 var(--disp)}
.tie .ln.out{opacity:.45}
.tie .hdr{display:grid;grid-template-columns:24px 1fr repeat(3,34px);gap:6px;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tie .hdr span{text-align:center}
.champ-card{padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(255,201,64,.22),transparent 65%),var(--surface);border-color:rgba(255,201,64,.4)}
.champ-card .t{font:800 30px/1 var(--disp);text-transform:uppercase}
.champ-card .k{font:700 14px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);font-size:16px}
.inp:focus{border-color:var(--accent2);outline:none}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rangewrap{display:flex;align-items:center;gap:12px}
.rangewrap output{min-width:48px;text-align:center;font:800 26px/1 var(--disp);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent2) var(--p,50%),var(--surface3) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--accent2);box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--accent2)}
.pickrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pickrow::-webkit-scrollbar{display:none}
.pick{flex:none;width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);border:2px solid var(--line)}
.pick.on{border-color:var(--accent);background:rgba(255,122,26,.1)}
.pick svg{width:40px;height:40px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18);position:relative}
.sw.on{outline:3px solid var(--text);outline-offset:2px}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.crest-hero{display:flex;justify-content:center;padding:18px 0 6px}
.types{display:grid;gap:10px}
.type{padding:14px;display:flex;gap:12px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.type.on{border-color:var(--accent)}
.type b{display:block;font:700 19px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.03em}
.type p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;display:grid;place-items:center}
.on>.radio{border-color:var(--accent)}
.on>.radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);flex:none;display:grid;place-items:center}
.on .chk{background:var(--accent);border-color:var(--accent)}
.on .chk::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pl-row .dor{width:30px;text-align:center;font:800 22px/1 var(--disp);color:var(--muted)}
.skill{min-width:40px;height:30px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font:800 18px/1 var(--disp);font-variant-numeric:tabular-nums;color:#0B1219}
.err{color:var(--rc);font-size:14px}

/* hoja modal */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(3,7,11,.6);display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--surface3);margin:0 auto 4px}
.sheet h3{margin:0;font:700 24px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em}
.sheet .acts{display:flex;gap:10px}
.sheet .acts .btn{flex:1}
.photo-pick{display:flex;align-items:center;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}

/* pre-partido */
.pitch{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 12.5%,var(--pitch2) 12.5% 25%);border:2px solid rgba(255,255,255,.25)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:74px}
.slot .av{width:48px;height:48px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.slot .nm{font:700 13px/1.05 var(--disp);text-transform:uppercase;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .tag{font:700 10px/1 var(--body);padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;letter-spacing:.04em}
.slot .tag.warn{background:var(--bad);color:#fff}
.slot.sel .av,.benchp.sel .av{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,122,26,.45)}
.bench{display:flex;gap:10px;flex-wrap:wrap}
.benchp{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.benchp .av{width:40px;height:40px;border:2.5px solid var(--surface3)}
.bars3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bar3 .l{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar3 .b{height:6px;margin-top:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.bar3 .b i{display:block;height:100%;background:var(--accent2)}

/* partido en vivo */
.match{min-height:100%;display:flex;flex-direction:column}
.sb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#152231,#101a24);border-bottom:1px solid var(--line);padding:8px 12px 0}
.sb-top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.sb-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:4px 0 10px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.sb-team b{font:700 17px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.sb-score{display:flex;flex-direction:column;align-items:center;gap:6px}
.sb-score .sc{font:800 58px/0.9 var(--disp);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.sb-score .sc i{font-style:normal;color:var(--faint);font-size:36px}
.sb-score .sc span.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.7);color:var(--gold)}100%{transform:scale(1)}}
.clock{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:800 19px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:62px;justify-content:center}
.clock.off{background:var(--surface3);color:var(--text)}
.clock .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.pens-sub{font:700 14px/1 var(--disp);color:var(--gold);letter-spacing:.06em}
.tl{position:relative;height:4px;background:var(--surface3);margin:0 -12px}
.tl i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .4s linear}
.speed{min-width:52px;height:34px;border-radius:9px;border:1.5px solid var(--line);font:800 17px/1 var(--disp);letter-spacing:.04em}
.speed.on{background:var(--accent2);border-color:var(--accent2);color:#021623}
.mom{height:56px;display:flex;align-items:center;gap:1px;padding:0 2px;position:relative}
.mom::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.mom i{flex:1;min-width:0;border-radius:1px;align-self:flex-end;max-width:5px}

<script>
window.__PWA = true;
/* ===== Motor de simulación Fútbol 7 ===== */
const POS = { POR: 'Portera', DEF: 'Defensa', MC: 'Centrocampista', DEL: 'Delantera', CUA: 'Cualquiera' };
const POS_SHORT = { POR: 'POR', DEF: 'DEF', MC: 'MC', DEL: 'DEL', CUA: 'CUA' };
// posiciones antiguas (Lateral / Defensa central) pasan a Defensa
const normPos = p => (p === 'DFC' || p === 'LAT') ? 'DEF' : p;
const FORMATIONS = {
  '1-3-2-1': ['POR', 'DEF', 'DEF', 'DEF', 'MC', 'MC', 'DEL'],
  '1-2-3-1': ['POR', 'DEF', 'DEF', 'MC', 'MC', 'MC', 'DEL'],
  '1-2-2-2': ['POR', 'DEF', 'DEF', 'MC', 'MC', 'DEL', 'DEL'],
  '1-3-1-2': ['POR', 'DEF', 'DEF', 'DEF', 'MC', 'DEL', 'DEL'],
};
// Efecto táctico de cada formación (se suma al peso de cada puesto)
const FORM_MOD = {
  '1-3-2-1': { att: .97, mid: 1, def: 1.06, chance: 1, name: 'Sólida', desc: 'Bloque compacto: frena a los equipos que tocan y tocan' },
  '1-2-3-1': { att: 1, mid: .95, def: .95, chance: 1, name: 'Control', desc: 'Manda en el medio: anula el contraataque' },
  '1-2-2-2': { att: 1.06, mid: .97, def: .93, chance: 1.03, name: 'Ofensiva', desc: 'Presión arriba: rompe a los equipos cerrados' },
  '1-3-1-2': { att: 1.06, mid: .98, def: 1.02, chance: 1.15, name: 'Contraataque', desc: 'Dos puntas al espacio: castiga a los que atacan' },

// Ventajas tácticas: la formación de la izquierda saca ventaja sobre la de la derecha
const FORM_BEATS = { '1-2-3-1': '1-3-1-2', '1-3-1-2': '1-2-2-2', '1-2-2-2': '1-3-2-1', '1-3-2-1': '1-2-3-1' };
const EDGE = { att: 1.08, mid: 1.04, def: 1.06 };
// coordenadas de cada puesto (x %, y % desde el arco propio abajo)
const FORM_XY = {
  '1-3-2-1': [[50, 88], [16, 64], [50, 66], [84, 64], [30, 42], [70, 42], [50, 16]],
  '1-2-3-1': [[50, 88], [30, 66], [70, 66], [14, 42], [50, 45], [86, 42], [50, 16]],
  '1-2-2-2': [[50, 88], [30, 66], [70, 66], [28, 43], [72, 43], [30, 17], [70, 17]],
  '1-3-1-2': [[50, 88], [16, 64], [50, 66], [84, 64], [50, 43], [30, 17], [70, 17]],
};
const FIT = {
  DEF: { MC: .82, DEL: .65 },
  MC: { DEF: .85, DEL: .85 },
  DEL: { DEF: .65, MC: .85 },
};
/* Puntos de habilidad que se restan al jugar fuera de posición (jugadora -> puesto) */
const PEN = {
  DEF: { MC: 10, DEL: 18 },
  MC: { DEF: 10, DEL: 8 },
  DEL: { MC: 8, DEF: 18 },
};
function posPenalty(pos, slot) {
  if (slot === 'POR') return pos === 'POR' ? 0 : pos === 'CUA' ? 30 : 40;
  if (pos === 'POR') return 35;
  if (pos === 'CUA' || pos === slot) return 0;
  return (PEN[pos] && PEN[pos][slot]) ?? 10;
}
function effSkill(p, slot) { return Math.max(1, p.skill - posPenalty(p.pos, slot)); }
function fit(pPos, slot) {
  if (slot === 'POR') return pPos === 'POR' ? 1 : pPos === 'CUA' ? .55 : .4;
  if (pPos === 'POR') return .45;
  if (pPos === 'CUA' || pPos === slot) return 1;
  return (FIT[slot] && FIT[slot][pPos]) || .7;

const W_ATT = { POR: 0, DEF: .25, MC: .7, DEL: 1 };
const W_MID = { POR: .05, DEF: .32, MC: 1, DEL: .4 };
const W_DEF = { POR: 0, DEF: .9, MC: .45, DEL: .15 };
const W_SHOOT = { POR: 0, DEF: .45, MC: 2, DEL: 6.5 };
const FINISH = { POR: .6, DEF: .85, MC: 1, DEL: 1.12 }; // definición según el puesto
const W_ASSIST = { POR: .05, DEF: 1.3, MC: 3, DEL: 2 };
const W_FOUL = { POR: .3, DEF: 2.5, MC: 2, DEL: 1 };

const R = Math.random;
function pick(arr, wf) {
  let tot = 0; const ws = arr.map(x => { const w = Math.max(0, wf(x)); tot += w; return w; });

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Alineación automática: mejor formación y asignación de puestos (DP sobre máscaras) */
function bestLineupFor(players, formation) {
  const slots = FORMATIONS[formation]; const n = players.length;
  if (n === 0) return null;
  const memo = new Map();
  function go(i, mask) {
    if (i === slots.length) return { v: 0, a: [] };
    const k = i * 1024 + mask; if (memo.has(k)) return memo.get(k);
    let best = { v: -1e9, a: null };
    let any = false;
    const used = mask.toString(2).split('1').length - 1;
    if (i > 0 && slots.length - i > n - used) { const r = go(i + 1, mask); if (r.a) best = { v: r.v, a: [-1, ...r.a] }; }
    for (let p = 0; p < n; p++) {
      if (mask & (1 << p)) continue; any = true;
      const r = go(i + 1, mask | (1 << p));
      if (!r.a) continue;
      const v = effSkill(players[p], slots[i]) + r.v;
      if (v > best.v) best = { v, a: [p, ...r.a] };
    }
    if (!any) { const r = go(i + 1, mask); best = { v: r.v, a: r.a ? [-1, ...r.a] : null }; }

  }
  const r = go(0, 0);
  const field = r.a.map((p, i) => ({ pid: p >= 0 ? players[p].id : null, slot: slots[i] }));
  const used = new Set(r.a.filter(p => p >= 0));
  const bench = players.filter((_, i) => !used.has(i)).map(p => p.id);

}
function autoLineup(team) {
  const players = (team.players || []).slice(0, 10);
  let best = null;
  for (const f of Object.keys(FORMATIONS)) {
    const l = bestLineupFor(players, f);
    if (l && (!best || l.value > best.value + 0.01)) best = l;
  }
  return best;
}
function lineupFor(team, formation) { return bestLineupFor((team.players || []).slice(0, 10), formation); }

/* Fuerza de un equipo con las jugadoras en cancha */
function teamStrength(M, t) {
  const T = M.teams[t]; let att = 0, mid = 0, def = 0, gk = 25;
  for (const f of T.field) {
    const p = M.players[f.pid]; if (!p) continue;

  return { att: att * syn * fm.att * e.att + 1, mid: mid * syn * fm.mid * e.mid + 1, def: def * syn * fm.def * e.def + 1, gk: gk * (0.9 + 0.2 * T.skill / 100), syn, chance: fm.chance };
}

}

/* Crear partido */
function createMatch(home, away, lineups, opts = {}) {
  const M = {
    minute: 0, period: 1, phase: 'pre', added: [0, 0, 0, 0], score: [0, 0], shootout: null,
    knockout: !!opts.knockout, neutral: !!opts.neutral, events: [], momentum: [], done: false,

    const L = lineups[t];

      id: team.id, name: team.name, abbr: team.abbr, skill: team.skill || 50, formation: L.formation,
      field: L.field.filter(f => f.pid).map(f => ({ pid: f.pid, slot: f.slot })), bench: L.bench.slice(), subsLeft: 2,
    });

        rating: 6.5, goals: 0, assists: 0, yc: 0, rc: 0, shots: 0, sot: 0, saves: 0, pens: 0,

}

function dispMin(M) {

  if (M.period === 1 && m > 45) return '45+' + (m - 45);
  if (M.period === 2 && m > 90) return '90+' + (m - 90);
  if (M.period === 3 && m > 105) return '105+' + (m - 105);

/* --- almacenamiento (IndexedDB con respaldo en memoria) --- */
const Store = {
  db: null, mem: { kv: {}, photos: {} },
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('f7sim', 1);
        rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('kv'); d.createObjectStore('photos'); };
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(store, mode, fn) {
    return new Promise(res => {
      if (!this.db) { res(fn(null)); return; }
      try {
        const t = this.db.transaction(store, mode); const os = t.objectStore(store); let out;
        const r = fn(os); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => res(out); t.onerror = () => res(undefined); t.onabort = () => res(undefined);
      } catch (e) { res(undefined); }
    });
  },
  get(store, k) { if (!this.db) return Promise.resolve(this.mem[store][k]); return this.tx(store, 'readonly', os => os.get(k)); },
  set(store, k, v) { if (!this.db) { this.mem[store][k] = v; return Promise.resolve(); } return this.tx(store, 'readwrite', os => os.put(v, k)); },
  del(store, k) { if (!this.db) { delete this.mem[store][k]; return Promise.resolve(); } return this.tx(store, 'readwrite', os => os.delete(k)); },
  async all(store) {
    if (!this.db) return Object.assign({}, this.mem[store]);
    const out = {};
    await new Promise(res => {
      try {
        const t = this.db.transaction(store, 'readonly'); const os = t.objectStore(store);
        const rq = os.openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } };
        t.oncomplete = res; t.onerror = res;
      } catch (e) { res(); }
    });
    return out;
  },
  async clear() { if (!this.db) { this.mem = { kv: {}, photos: {} }; return; } await this.tx('kv', 'readwrite', os => os.clear()); await this.tx('photos', 'readwrite', os => os.clear()); },
};

function readPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(img.width, img.height); const out = 320;
        const c = document.createElement('canvas'); c.width = c.height = out;
        const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';

        res(c.toDataURL('image/jpeg', 0.84));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* --- lógica de liga --- */
function roundRobin(ids) {
  const arr = ids.slice(); if (arr.length % 2) arr.push(null);
  const n = arr.length; const rounds = [];
  const home = {}, last = {}; ids.forEach(id => { home[id] = 0; last[id] = null; });
  for (let r = 0; r < n - 1; r++) {
    const pairs = []; let bye = null;
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      if (!a || !b) { bye = a || b; continue; }
      // local: quien lleva menos partidos en casa; si empatan, quien jugó de visita la fecha anterior
      let h;
      if (home[a] !== home[b]) h = home[a] < home[b] ? a : b;
      else if (last[a] !== last[b]) h = last[a] === 'A' ? a : last[b] === 'A' ? b : (Math.random() < .5 ? a : b);
      else h = Math.random() < .5 ? a : b;
      const aw = h === a ? b : a;
      home[h]++; last[h] = 'H'; last[aw] = 'A';
      pairs.push([h, aw]);
    }
    rounds.push({ pairs, bye });
    arr.splice(1, 0, arr.pop());
  }
  return rounds;
}
/* Equilibra partidos de local en la fase regular: da vuelta partidos pendientes si una tiene 2+ localías más que su rival */
function balanceHome(fixtures) {
  const c = {}; fixtures.filter(f => f.stage === 'L').forEach(f => { c[f.home] = (c[f.home] || 0) + 1; c[f.away] = c[f.away] || 0; });
  let changed = true, guard = 0;
  while (changed && guard++ < 500) {
    changed = false;
    for (const f of fixtures) {
      if (f.stage !== 'L' || f.res) continue;
      if (c[f.home] - c[f.away] >= 2) { c[f.home]--; c[f.away]++; const t = f.home; f.home = f.away; f.away = t; changed = true; }
    }
  }
}

  if (type === 'dbl') rr.forEach((rd, i) => { const r = rr.length + i + 1; rd.pairs.forEach(([h, a]) => fixtures.push({ id: uid(), stage: 'L', round: r, home: a, away: h, res: null })); if (rd.bye) byes[r] = rd.bye; });

  return { fixtures, byes, draw };
}

  const field = FORMATIONS[pref.formation].map((slot, i) => ({ slot, pid: pref.field[i] && ok.has(pref.field[i]) ? pref.field[i] : null }));

const leagueDone = lg => lg.fixtures.filter(f => f.stage === 'L').every(f => f.res);

    legs.forEach(l => { if (!l.res) return; if (l.home === hi) { gHi += l.res.hs; gLo += l.res.as; } else { gLo += l.res.hs; gHi += l.res.as; } });

function progressLeague(lg) {

      const st = standings(lg);
      if (st.length >= 4) {
        [[0, 3], [1, 2]].forEach(([a, b], k) => {
          const hi = st[a].id, lo = st[b].id;
          lg.fixtures.push({ id: uid(), stage: 'SF', tie: k, round: 1, home: lo, away: hi, seeds: [a + 1, b + 1], res: null });
          lg.fixtures.push({ id: uid(), stage: 'SF', tie: k, round: 2, home: hi, away: lo, seeds: [a + 1, b + 1], res: null });
        });

    if (ties.length && ties.every(t => t.done) && !lg.fixtures.some(f => f.stage === 'F')) {

      const [w1, w2] = [ties[0].winner, ties[1].winner].sort((a, b) => pos(a) - pos(b));
      lg.fixtures.push({ id: uid(), stage: 'F', round: 1, home: w1, away: w2, res: null });
    }
    const F = lg.fixtures.find(f => f.stage === 'F');
    lg.champion = F && F.res ? (F.res.winner === 0 ? F.home : F.away) : null;
  } else {

}
function isPlayable(lg, f) {

function teamColors(H, A) {
  const pickC = t => { const L = (t && t.logo) || {}; return lum(L.c1) < 0.22 ? (lum(L.c2) < 0.22 ? '#9AA4AE' : L.c2) : L.c1; };
  const other = t => { const L = (t && t.logo) || {}; return lum(L.c2) < 0.22 ? '#9AA4AE' : L.c2; };
  const dist = (a, b) => { const h = x => { const n = parseInt(x.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }; const [p, q] = [h(a), h(b)]; return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
  let a = pickC(H), b = pickC(A);
  if (dist(a, b) < 90) { b = other(A); if (dist(a, b) < 90) b = '#2FB4FF'; if (dist(a, b) < 90) b = '#FF7A1A'; }
  return [a, b];
}
function lineupStrength(team, L) {
  let att = 0, mid = 0, def = 0, wa = 0, wm = 0, wd = 0;
  L.field.forEach(f => {
    const p = team.players.find(x => x.id === f.pid); if (!p) return;
    const e = effSkill(p, f.slot);
    att += e * W_ATT[f.slot]; mid += e * W_MID[f.slot]; def += e * (f.slot === 'POR' ? 1 : W_DEF[f.slot]);
    wa += W_ATT[f.slot]; wm += W_MID[f.slot]; wd += f.slot === 'POR' ? 1 : W_DEF[f.slot];
  });
  const fm = FORM_MOD[L.formation] || { att: 1, mid: 1, def: 1 }; const c = v => Math.min(99, Math.round(v));
  return { att: c(att / (wa || 1) * fm.att), mid: c(mid / (wm || 1) * fm.mid), def: c(def / (wd || 1) * fm.def) };
}

function evHTML(e, info, T, cols) {
  const INFO = { ko: 'Comienza el partido', ht: 'Entretiempo', start2: 'Comienza el 2º tiempo', ft90: 'Final de los 90 minutos', etStart: 'Comienza la prórroga', etHt: 'Descanso de la prórroga', pensStart: 'Tanda de penales', ft: 'Final del partido' };
  if (INFO[e.type]) {
    const sc = ['ht', 'ft90', 'ft', 'etHt'].includes(e.type) && e.sc ? ` · ${e.sc[0]}-${e.sc[1]}` : '';
    return `<div class="evt info ${['ht', 'ft', 'ft90'].includes(e.type) ? 'big' : ''}"><div>${INFO[e.type]}${sc}</div></div>`;
  }
  if (e.type === 'added') return `<div class="evt info"><div>+${e.n} min de descuento</div></div>`;
  const p = info(e.pid) || { name: '?' }; const p2 = e.pid2 ? info(e.pid2) : null;
  const team = T[e.team];
  let ic = '', k = '', nm = esc(p.name), s = '', cls = '';
  switch (e.type) {
    case 'goal': ic = IC.ball; k = '¡Gol!'; cls = 'goal'; s = p2 ? 'Asistencia: ' + esc(p2.name) : ''; break;
    case 'penGoal': ic = IC.ball; k = '¡Gol! (Pen)'; cls = 'goal'; break;
    case 'penMiss': ic = IC.ballMiss; k = e.saved ? 'Penal atajado' : 'Penal fallado'; s = p2 ? 'Ataja: ' + esc(p2.name) : ''; break;
    case 'yellow': ic = IC.yc; k = 'Tarjeta amarilla'; break;
    case 'second': ic = IC.y2; k = 'Doble amarilla'; s = 'Expulsada'; break;
    case 'red': ic = IC.rc; k = 'Tarjeta roja'; s = 'Expulsada'; break;
    case 'injury': ic = IC.inj; k = 'Lesión'; s = 'Baja: ' + e.games + (e.games === 1 ? ' partido' : ' partidos') + (p2 ? ' · Falta de ' + esc(p2.name) : ''); break;
    case 'sub': ic = IC.sub; k = 'Cambio'; nm = 'Entra: ' + esc(p.name); s = p2 ? 'Sale: ' + esc(p2.name) : ''; break;
    case 'soGoal': ic = IC.ball; k = 'Anota'; s = `Tanda ${e.so[0]}-${e.so[1]}`; break;
    case 'soMiss': ic = IC.ballMiss; k = 'Falla'; s = `Tanda ${e.so[0]}-${e.so[1]}`; break;
  }
  if (['goal', 'penGoal'].includes(e.type) && e.sc) s = (s ? s + ' · ' : '') + `${e.sc[0]}-${e.sc[1]}`;
  const side = e.team === 0 ? 'h' : 'a';
  const minute = ['soGoal', 'soMiss'].includes(e.type) ? 'PEN' : e.disp + "'";
  const showAv = ['goal', 'penGoal', 'penMiss', 'sub', 'soGoal', 'soMiss', 'red', 'second', 'injury'].includes(e.type);
  return `<div class="evt ${side} ${cls}"><span class="m">${minute}</span><i class="tb" style="background:${cols ? cols[e.team] : 'var(--line)'}"></i><div class="box"><span class="ic">${ic}</span>${showAv ? avatar(p, 36, team) : ''}<div class="tx"><div class="k">${k}</div><div class="p">${nm}</div>${s ? `<div class="s">${s}</div>` : ''}</div></div></div>`;
}
function momHTML(vals, per, goals, cols, live) {
  const sm = vals.map((v, i) => { const a = vals[i - 1] ?? v, b = vals[i + 1] ?? v; return (a + 2 * v + b) / 4; });
  let out = ''; let lastP = per[0];
  sm.forEach((v, i) => {
    if (per[i] !== lastP) { out += '<span class="ht"></span>'; lastP = per[i]; }
    out += momCol(goals.has(i) ? vals[i] : v, goals.has(i), cols);
  });
  return out;
}
function momCol(v, goal, cols) {
  const h = Math.round(Math.min(1, Math.abs(v)) * 100);
  return `<div class="col ${goal ? 'goal' : ''}"><div class="u">${v > 0 ? `<b style="height:${h}%;background:${cols[0]}"></b>` : ''}</div><div class="d">${v < 0 ? `<b style="height:${h}%;background:${cols[1]}"></b>` : ''}</div></div>`;
}

/* ---------- PARTIDO EN VIVO ---------- */
let LIVE = null; let wakeLock = null;
function stopMatch() {
  if (LIVE && LIVE.timer) { clearTimeout(LIVE.timer); LIVE.timer = null; }
  if (wakeLock) { try { wakeLock.release(); } catch (e) { } wakeLock = null; }
}
function clockLabel(M) {
  if (M.phase === 'pre') return "0'";
  if (M.phase === 'ht' || M.phase === 'etHt') return 'Descanso';
  if (M.phase === 'etBreak') return "Fin 90'";
  if (M.phase === 'pens') return 'Penales';
  if (M.phase === 'ft') return 'Final';
  return dispMin(M) + "'";
}
SCREENS.match = {
  html(p) {
    if (!LIVE || LIVE.fx !== p.fx) return `${topbar('Partido')}<main class="content"><div class="card empty"><p>El partido se interrumpió. Vuelve a la liga para jugarlo de nuevo.</p></div></main>`;
    const lg = leagueById(p.lg); const f = lg.fixtures.find(x => x.id === p.fx);
    const T = [teamById(f.home), teamById(f.away)]; LIVE.T = T; LIVE.cols = teamColors(T[0], T[1]);
    const M = LIVE.M;
    return `<div class="match"><div class="sb duel" style="--hc:${LIVE.cols[0]};--ac:${LIVE.cols[1]}">
      <div class="sb-top"><button class="iconbtn" data-act="back" aria-label="Salir">${IC.back}</button><span class="muted up" style="font-size:12px;font-weight:700">${esc(stageLabel(f, lg))}</span><button class="speed ${LIVE.speed === 2 ? 'on' : ''}" id="spd" aria-pressed="${LIVE.speed === 2}">x2</button></div>
      <div class="sb-grid"><div class="sb-team">${crestSVG(T[0], 58)}<b>${esc(T[0].name)}</b></div>
        <div class="sb-score"><div class="sc"><span id="s0">${M.score[0]}</span><i>-</i><span id="s1">${M.score[1]}</span></div><span class="clock" id="clk"><span class="dot"></span><span id="clkT">${clockLabel(M)}</span></span><span class="pens-sub" id="pensSub"></span></div>
        <div class="sb-team">${crestSVG(T[1], 58)}<b>${esc(T[1].name)}</b></div></div>
      <div class="mom" id="mom"></div>
      <div class="tl"><i id="tl" style="width:0%"></i></div></div>
      <div id="so" hidden style="padding:0 16px"></div>
      <div class="feed" id="feed"></div>
      <div class="endbar" id="endbar" hidden><div class="grid2"><button class="btn ghost" id="toLg">Liga</button><button class="btn pri" id="toSum">Resumen</button></div></div></div>`;
  },
  after(p) {
    if (!LIVE || LIVE.fx !== p.fx) return;
    const M = LIVE.M;
    const info = pid => M.players[pid];
    const feed = $('#feed'); const mom = $('#mom');
    // reconstruir si se re-renderiza
    feed.innerHTML = M.events.slice().reverse().map(e => evHTML(e, info, LIVE.T, LIVE.cols)).join('');
    const goalsIdx = new Set(M.events.filter(e => ['goal', 'penGoal'].includes(e.type)).map(e => e.mi));
    mom.innerHTML = momHTML(M.momentum.map(x => x.v), M.momentum.map(x => x.p), goalsIdx, LIVE.cols);
    NAV.guard = () => {
      if (M.done) { NAV.guard = null; popRoute(); return; }
      const was = LIVE.timer; stopMatch();
      confirmSheet('¿Salir del partido?', 'El partido está en juego. Si sales, no se guardará el resultado.', 'Salir', () => { NAV.guard = null; LIVE = null; popRoute(); });
      setTimeout(() => { const s = $('#sheet'); if (!s) return; $('#cNo', s).onclick = () => { closeSheet(); if (was !== null) loop(); }; s.onclick = e => { if (e.target === s) { closeSheet(); loop(); } }; }, 0);
    };
    $('#spd').onclick = e => { LIVE.speed = LIVE.speed === 2 ? 1 : 2; e.currentTarget.classList.toggle('on', LIVE.speed === 2); e.currentTarget.setAttribute('aria-pressed', LIVE.speed === 2); if (LIVE.timer) { clearTimeout(LIVE.timer); LIVE.timer = setTimeout(tick, 300); } };
    $('#toLg').onclick = () => back();
    $('#toSum').onclick = () => replace('summary', { lg: p.lg, fx: p.fx, tab: 'ev' });
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wakeLock = w; }).catch(() => { }); } catch (e) { }
    const upd = () => {
      $('#clkT').textContent = clockLabel(M);
      $('#clk').classList.toggle('off', M.phase !== 'play');
      const tot = M.knockout && M.period >= 3 ? 120 : 90;
      $('#tl').style.width = Math.min(100, (Math.min(M.minute, tot) / tot) * 100) + '%';
      if (M.shootout) {
        const so = M.shootout; const b = $('#so'); b.hidden = false;
        const dots = k => { const arr = so.kicks[k].map(x => `<i class="${x ? 'y' : 'n'}"></i>`); while (arr.length < 5) arr.push('<i></i>'); return arr.join(''); };
        b.innerHTML = `<div class="card so" style="padding:12px 14px;margin-top:10px">${[0, 1].map(k => `<div class="ln"><b>${esc(LIVE.T[k].abbr)}</b><div class="dots">${dots(k)}</div><span style="margin-left:auto;font:800 22px/1 var(--disp)">${so.kicks[k].filter(Boolean).length}</span></div>`).join('')}</div>`;
        $('#pensSub').textContent = `Penales ${so.kicks[0].filter(Boolean).length}-${so.kicks[1].filter(Boolean).length}`;
      }
    };
    upd();
    function tick() {
      const evs = step(M);
      const lastMom = M.momentum.length;
      for (const e of evs) {
        feed.insertAdjacentHTML('afterbegin', evHTML(e, info, LIVE.T, LIVE.cols));
        if (e.type === 'goal' || e.type === 'penGoal') celebrate(e, M);
      }
      if (M.phase === 'play' && evs.length !== undefined) {
        // columna de momentum nueva
        const n = mom.querySelectorAll('.col').length;
        if (lastMom > n) {
          const x = M.momentum[lastMom - 1];
          const prevP = n ? M.momentum[n - 1].p : x.p;
          if (x.p !== prevP) mom.insertAdjacentHTML('beforeend', '<span class="ht"></span>');
          const g = evs.some(e => (e.type === 'goal' || e.type === 'penGoal'));
          const prev = n ? M.momentum[n - 1].v : x.v;
          mom.insertAdjacentHTML('beforeend', momCol(g ? x.v : (prev + 3 * x.v) / 4, g, LIVE.cols));
        }
      }
      upd();
      if (M.done) { finishLive(p); return; }
      const pause = evs.some(e => ['ht', 'ft90', 'etHt', 'pensStart'].includes(e.type));
      const d = (M.phase === 'pens' ? 1500 : pause ? 3000 : 1000) / LIVE.speed;
      LIVE.timer = setTimeout(tick, d);
    }
    function loop() { if (!M.done) LIVE.timer = setTimeout(tick, 600 / LIVE.speed); }
    if (M.done) { upd(); finishLive(p, true); } else loop();
  },
};
function celebrate(e, M) {
  const s = $('#s' + e.team); if (s) { s.textContent = M.score[e.team]; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
  const col = LIVE.cols[e.team];
  const d = document.createElement('div'); d.className = 'goalflash'; d.style.setProperty('--gfc', col + '66');
  d.innerHTML = `<div>¡GOOOL!<small>${esc(LIVE.T[e.team].name)}</small></div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1700);
  if (DATA.settings.vibrate) { try { navigator.vibrate && navigator.vibrate([120, 60, 220]); } catch (x) { } }
}
function finishLive(p, silent) {
  stopMatch();
  const lg = leagueById(p.lg); const f = lg && lg.fixtures.find(x => x.id === p.fx);
  if (f && !LIVE.saved) {
    f.res = matchResult(LIVE.M); LIVE.saved = true;
    migrateLeague(lg); applyAvailability(lg, f); progressLeague(lg); saveNow();
  }
  $('#endbar').hidden = false;
  NAV.guard = null;
  if (!silent) setTimeout(() => { const eb = $('#endbar'); if (eb) eb.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 200);
}

/* ---------- RESUMEN ---------- */
SCREENS.summary = {
  html(p) {
    const lg = leagueById(p.lg); const f = lg && lg.fixtures.find(x => x.id === p.fx);
    if (!f || !f.res) return `${topbar('Resumen')}<main class="content"><div class="card empty"><p>Este partido aún no se ha jugado.</p></div></main>`;
    const r = f.res; const T = [teamById(f.home), teamById(f.away)]; const cols = teamColors(T[0], T[1]);
    const lineOf = pid => r.lines.find(l => l.pid === pid);
    const info = pid => { const l = lineOf(pid); if (!l) return null; const t = T[l.team]; const cur = t && t.players.find(x => x.id === pid); return Object.assign({}, l, { photo: cur ? cur.photo : null, name: cur ? cur.name : l.name }); };
    const sub = r.pens ? `Penales ${r.pens[0]}-${r.pens[1]}` : r.et ? 'Tras prórroga' : '';
    const head = `<div class="card duel" style="padding:16px 12px;--hc:${cols[0]};--ac:${cols[1]}"><div class="sb-grid" style="padding:0"><div class="sb-team">${crestSVG(T[0], 58)}<b>${esc(T[0].name)}</b></div>
      <div class="sb-score"><div class="sc"><span>${r.hs}</span><i>-</i><span>${r.as}</span></div><span class="clock off">Final</span>${sub ? `<span class="pens-sub">${sub}</span>` : ''}</div>
      <div class="sb-team">${crestSVG(T[1], 58)}<b>${esc(T[1].name)}</b></div></div></div>`;
    const tabs = [['ev', 'Resumen'], ['st', 'Stats'], ['rt', 'Notas']];
    let body = '';
    if (p.tab === 'st') {
      const S = r.stats;
      const rows = [['Posesión', 'poss', '%'], ['Tiros totales', 'shots'], ['Tiros a puerta', 'sot'], ['Atajadas', 'saves'], ['Córners', 'corners'], ['Faltas', 'fouls'], ['Tarjetas amarillas', 'yc'], ['Tarjetas rojas', 'rc']];
      body = `<div class="card list">${rows.map(([l, k, u]) => {
        const a = S[0][k], b = S[1][k], m = Math.max(a, b, 1);
        return `<div class="stat"><span class="v num">${a}${u || ''}</span><div class="c"><span>${l}</span><div class="bb"><div class="l"><i style="width:${a / m * 100}%;background:${a >= b ? cols[0] : 'var(--faint)'}"></i></div><div class="rr"><i style="width:${b / m * 100}%;background:${b >= a ? cols[1] : 'var(--faint)'}"></i></div></div></div><span class="v r num">${b}${u || ''}</span></div>`;
      }).join('')}</div>`;
    } else if (p.tab === 'rt') {
      body = [0, 1].map(k => {
        const ls = r.lines.filter(l => l.team === k).sort((a, b) => b.rating - a.rating);
        return `<div class="sec-t"><h2 style="display:flex;align-items:center;gap:8px">${crestSVG(T[k], 22)}${esc(T[k].abbr)}</h2><span class="muted num" style="font-size:13px">${r.formations ? r.formations[k] : ''}</span></div><div class="card list">${ls.map(l => {
          const I = info(l.pid);
          const minis = '<span class="minis">' + IC.ball.replace('<svg', '<svg width="13" height="13"').repeat(l.goals) + (l.assists ? `<span class="chip" style="padding:1px 5px;font-size:10px">A${l.assists > 1 ? '×' + l.assists : ''}</span>` : '') + (l.yc && !l.rc ? '<span class="card-ic" style="background:var(--yc);width:9px;height:13px"></span>' : '') + (l.rc ? '<span class="card-ic" style="background:var(--rc);width:9px;height:13px"></span>' : '') + (l.inj ? IC.inj.replace('<svg', '<svg width="13" height="13"') : '') + '</span>';
          const subTxt = !l.start ? `<span style="color:var(--good)">▲${l.minIn}'</span> ` : l.minOut < (r.et ? 120 : 90) && l.minOut != null && !l.rc ? `<span style="color:var(--rc)">▼${l.minOut}'</span> ` : '';
          return `<div class="row" style="min-height:56px">${avatar(I, 40, T[k])}<div class="grow"><div class="t1">${esc(I.name)}${r.mvp === l.pid ? ' ' + IC.crown.replace('<svg', '<svg width="16" height="16" style="vertical-align:-2px"') : ''}${minis}</div><div class="t2">${l.num} · ${POS[l.pos]} ${subTxt}</div></div><span class="rt" style="background:${ratingColor(l.rating)}">${l.rating.toFixed(1)}</span></div>`;
        }).join('')}</div>`;
      }).join('');
    } else {
      const mvp = r.mvp && info(r.mvp);
      const goals = new Set(r.events.filter(e => ['goal', 'penGoal'].includes(e.type)).map(e => e.mi));
      body = `${mvp ? `<div class="card mvp">${avatar(mvp, 64, T[mvp.team])}<div style="flex:1;min-width:0"><div class="k">Jugadora del partido</div><div class="n">${esc(mvp.name)}</div><div class="muted" style="font-size:13px">${esc(T[mvp.team].name)} · ${mvp.goals ? mvp.goals + (mvp.goals > 1 ? ' goles' : ' gol') + ' · ' : ''}${mvp.assists ? mvp.assists + (mvp.assists > 1 ? ' asist.' : ' asist.') + ' · ' : ''}${POS[mvp.pos]}</div></div><span class="rt" style="background:${ratingColor(mvp.rating)};font-size:20px;height:34px;min-width:48px">${mvp.rating.toFixed(1)}</span></div>` : ''}
        <div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)"><span style="color:${cols[0]}">▲ ${esc(T[0].abbr)}</span><span>Presión</span><span style="color:${cols[1]}">${esc(T[1].abbr)} ▼</span></div><div class="mom" style="height:70px;margin-top:8px">${momHTML(r.momentum, r.momP || r.momentum.map(() => 1), goals, cols)}</div></div>
        <div class="card"><div class="feed" style="padding:4px 12px 8px">${r.events.map(e => evHTML(e, info, T, cols)).join('')}</div></div>`;
    }
    return `${topbar(stageLabel(f, lg))}<main class="content notab">${head}<div class="seg">${tabs.map(([k, l]) => `<button class="${p.tab === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('')}</div>${body}</main>`;
  },
  after(p) {
    app().querySelectorAll('[data-st]').forEach(b => b.onclick = () => { p.tab = b.dataset.st; render(); });
  },
};

/* ===== Arranque ===== */
(async function init() {
  await Store.open();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  const d = await Store.get('kv', 'data');
  if (d && d.teams) DATA = Object.assign({ settings: { vibrate: true } }, d);
  PHOTOS = await Store.all('photos') || {};
  if (!d) loadSample();
  // limpiar fotos huérfanas
  const used = new Set(); DATA.teams.forEach(t => t.players.forEach(p => p.photo && used.add(p.photo)));
  Object.keys(PHOTOS).forEach(k => { if (!used.has(k)) delPhoto(k); });
  migrateTeams(); DATA.leagues.forEach(l => { migrateLeague(l); progressLeague(l); }); save();
  NAV.stack = [{ name: 'leagues', params: {} }];
  try { history.replaceState({ d: 1 }, ''); } catch (e) { }
  render();
  window.__PWA = true; if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
